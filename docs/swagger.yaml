paths:
  /api/methods:
    get:
      consumes:
      - application/json
      description: List payment methods with pagination
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaymentMethodListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.PaymentMethodListResponse'
      summary: List payment methods
      tags:
      - PaymentMethod
    post:
      consumes:
      - application/json
      description: Create new payment method
      parameters:
      - description: Create Payment Method request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreatePaymentMethodRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaymentMethodDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.PaymentMethodDetailResponse'
      summary: Create payment method
      tags:
      - PaymentMethod
  /api/methods/{id}:
    delete:
      consumes:
      - application/json
      description: Delete payment method by ID
      parameters:
      - description: Payment Method ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaymentMethodDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.PaymentMethodDetailResponse'
      summary: Delete payment method
      tags:
      - PaymentMethod
    get:
      consumes:
      - application/json
      description: Get detail of payment method by ID
      parameters:
      - description: Payment Method ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaymentMethodDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.PaymentMethodDetailResponse'
      summary: Get payment method
      tags:
      - PaymentMethod
    put:
      consumes:
      - application/json
      description: Update existing payment method by ID
      parameters:
      - description: Payment Method ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Payment Method request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdatePaymentMethodRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaymentMethodDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.PaymentMethodDetailResponse'
      summary: Update payment method
      tags:
      - PaymentMethod
