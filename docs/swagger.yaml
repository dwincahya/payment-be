basePath: /
definitions:
  models.CreatePaymentMethodRequest:
    properties:
      code:
        maxLength: 25
        type: string
      desc:
        type: string
      name:
        maxLength: 50
        type: string
      order_num:
        type: integer
      user_action:
        maxLength: 25
        type: string
    required:
    - code
    - desc
    - name
    - order_num
    - user_action
    type: object
  models.PageMetadata:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total_item:
        type: integer
      total_page:
        type: integer
    type: object
  models.PaymentMethodDetailResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/models.PaymentMethodResponse'
      errors:
        type: string
      message:
        type: string
      paging:
        $ref: '#/definitions/models.PageMetadata'
    type: object
  models.PaymentMethodListResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/models.PaymentMethodResponse'
        type: array
      errors:
        type: string
      message:
        type: string
      paging:
        $ref: '#/definitions/models.PageMetadata'
    type: object
  models.PaymentMethodResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      desc:
        type: string
      id:
        type: integer
      name:
        type: string
      order_num:
        type: integer
      updated_at:
        type: string
      user_action:
        type: string
    type: object
  models.UpdatePaymentMethodRequest:
    properties:
      code:
        maxLength: 25
        type: string
      desc:
        type: string
      id:
        type: integer
      name:
        maxLength: 50
        type: string
      order_num:
        type: integer
      user_action:
        maxLength: 25
        type: string
    required:
    - code
    - desc
    - name
    - order_num
    - user_action
    type: object
